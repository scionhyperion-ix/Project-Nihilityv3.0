name: Deploy Project Nihility

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build Pages artifact
        run: |
          mkdir -p _site/assets/css _site/assets/js
          cp index.html _site/
          cp assets/css/app.css _site/assets/css/
          cp assets/js/app.js _site/assets/js/
          cp assets/js/api.js _site/assets/js/
          cp assets/js/config.js _site/assets/js/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
